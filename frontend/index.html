<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieHub Direct Downloads</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <header class="hero">
      <h1>🎬 MovieHub</h1>
      <p>Direct movie links with smart search, language filters, and smooth animations.</p>
    </header>

    <section class="controls">
      <input id="search" type="text" placeholder="Search movie name..." />
      <select id="langFilter"><option value="">All Languages</option></select>
      <input id="yearFilter" type="number" placeholder="Year" min="1900" max="2100" />
      <button id="refreshBtn">Refresh</button>
    </section>

    <section class="stats">
      <span id="movieCount">0 movies</span>
    </section>

    <main id="grid" class="movie-grid"></main>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button id="closeModal" class="close">✖</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
