<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieHub Direct Downloads</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <header class="hero">
      <h1>🎬 MovieHub</h1>
      <p>Search movies and open the movie page for full download links.</p>
    </header>

    <section class="controls">
      <input id="search" type="text" placeholder="Search movie title..." />
      <select id="langFilter"><option value="">All Languages</option></select>
      <input id="yearFilter" type="number" placeholder="Year" min="1900" max="2100" />
      <button id="refreshBtn">Refresh</button>
    </section>

    <section class="stats">
      <span id="movieCount">0 movies</span>
    </section>

    <main id="grid" class="movie-grid"></main>

    <script src="/assets/config.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
